<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pengaturan Akun · Baylos</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#24211c;background:#faf7ef}*{box-sizing:border-box}body{margin:0}header{background:#141414;color:#efd18b;border-bottom:2px solid #caa45a;padding:16px max(16px,calc((100vw - 1050px)/2));display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}a{color:inherit}nav{display:flex;gap:12px;flex-wrap:wrap}main{max-width:1050px;margin:auto;padding:24px 16px 70px}h1{margin-top:0}.card{background:#fff;border:1px solid #e7dcc4;border-radius:15px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.muted{color:#756e61}.notice{background:#fff0c9;border-radius:12px;padding:13px;line-height:1.5}button,.btn{background:#191816;color:#f2d797;border:1px solid #caa45a;border-radius:10px;padding:10px 14px;font:inherit;text-decoration:none;cursor:pointer}button.secondary{background:#fff;color:#29251e}button:disabled{opacity:.5}input,select,textarea{font:inherit;padding:10px;border:1px solid #cfc4b1;border-radius:9px;width:100%;margin:5px 0 12px}label{display:block}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee5d5} .tablewrap{overflow:auto} .empty{padding:18px;text-align:center;color:#756e61} [hidden]{display:none!important}@media(max-width:600px){header{padding:14px}main{padding:18px 12px 60px}.card{padding:14px}th,td{padding:8px;font-size:.9rem}}</style></head><body><header><a href="../index.html"><strong>✦ BAYLOS</strong></a><nav><a href="storefront.html">Katalog</a><a href="my-orders.html">Pesanan</a><a href="affiliate-dashboard.html">Afiliasi</a><a href="account-settings.html">Akun</a><a href="help-center.html">Bantuan</a></nav></header><main><p class="muted">BAYLOS · AREA PENGGUNA</p><h1>Profil & Pengaturan Akun</h1><div class="notice" data-mode></div><section class="card"><form id="form"><label>Nama lengkap<input id="name" maxlength="100" autocomplete="name" required></label><label>Nomor telepon<input id="phone" inputmode="tel" maxlength="20" autocomplete="tel"></label><label>Nama tampilan<input id="display" maxlength="60"></label><button>Simpan draf profil</button> <button type="button" class="secondary" id="clear">Kosongkan</button></form><p id="msg" role="status"></p></section><section class="card"><h2>Keamanan akun</h2><p>Perubahan email/kata sandi harus dilakukan melalui autentikasi Supabase resmi. Jangan menyimpan kata sandi dalam localStorage.</p><button id="security" class="secondary">Petunjuk keamanan</button><p id="securityMsg" role="status"></p></section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="baylos-supabase-config.js"></script><script src="baylos-supabase.js"></script><script>
(async()=>{const $=id=>document.getElementById(id),msg=$('msg');let user=null;try{if(!window.BaylosAPI?.ready)throw Error('Supabase belum dikonfigurasi. Profil belum dapat dimuat atau disimpan ke server.');const session=await BaylosAPI.session();if(!session?.user)throw Error('Silakan masuk ke akun Baylos untuk mengubah profil.');user=session.user;const profile=await BaylosAPI.profile();$('name').value=profile?.full_name||user.user_metadata?.full_name||'';$('phone').value=profile?.phone||'';$('display').value=user.user_metadata?.display_name||'';$('[data-mode]').textContent='Profil terhubung ke akun '+(user.email||'Baylos')+'. Perubahan nama dan telepon disimpan ke profil akun.';}catch(e){$('[data-mode]').textContent=e.message;msg.textContent=e.message;}
$('form').onsubmit=async e=>{e.preventDefault();try{if(!user||!window.BaylosAPI?.client)throw Error('Masuk dan hubungkan Supabase terlebih dahulu.');const full_name=$('name').value.trim(),phone=$('phone').value.trim(),display_name=$('display').value.trim();if(full_name.length<2)throw Error('Nama lengkap minimal 2 karakter.');const {data,error}=await BaylosAPI.client.from('profiles').update({full_name,phone:phone||null}).eq('id',user.id).select('id').maybeSingle();if(error)throw error;if(!data)throw Error('Profil tidak tersimpan. Pastikan baris profil tersedia dan izin RLS mengizinkan pengguna memperbarui profilnya sendiri.');const {error:metaError}=await BaylosAPI.client.auth.updateUser({data:{display_name}});if(metaError)throw metaError;msg.textContent='Profil berhasil disimpan ke akun Baylos.';}catch(err){msg.textContent=err.message||'Gagal menyimpan profil.';}};
$('clear').onclick=()=>{ $('form').reset();msg.textContent='Formulir dibersihkan. Data akun di server tidak dihapus.';};$('security').onclick=()=>{$('securityMsg').textContent='Gunakan fitur pemulihan resmi Supabase. Jangan membagikan kata sandi atau service-role key.';};
})();</script></main><script src="baylos-stage22-30.js"></script></body></html>
